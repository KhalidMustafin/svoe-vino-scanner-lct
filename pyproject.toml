[project]
name = "svoe-vino-scanner"
version = "0.1.0"
description = "Сканер российских вин: фото бутылки → карточка каталога «Своё Вино»"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pillow-heif>=1.0",
    "pydantic>=2.8",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.7",
    "torchvision>=0.22",
]
# Полевой стенд на VPS без видеокарты: тот же torch, но колесом с индекса CPU. CUDA-сборка
# там весит лишние гигабайты и всё равно не работает, а `SVS_DEVICE=cpu` считает тем же
# кодом — расходятся только скорость и бэкенд Ollama. Экстра несовместима с `gpu` (ниже
# `tool.uv.conflicts`): в одном окружении живёт что-то одно.
cpu = [
    "torch>=2.7",
    # `AutoImageProcessor` у transformers 5 по умолчанию быстрый и держится на torchvision.
    # Без него препроцессор не собирается вовсе, а `use_fast=False` — это другая реализация
    # масштабирования: другие пиксели, другие косинусы, другой top-20. Замер так не повторить.
    "torchvision>=0.22",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
ocr = [
    "easyocr>=1.7.2",
    "onnxruntime>=1.30.0",
    "rapidocr>=3.9.2",
]
cv = [
    "transformers>=5.17.0",
]
api = [
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[tool.uv]
# rapidocr тянет полный opencv-python, а он пишет в тот же пакет cv2, что и headless-сборка.
# Две сборки в одном окружении ломаются при удалении любой из них — оставляем только headless.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
# Один torch на окружение: CUDA-колесо и CPU-колесо ставятся в один каталог и затирают друг
# друга. Разрешать их вместе нельзя даже в решателе.
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# research/ — скрипты зондов как запускались (абсолютные пути, разовый код), не код сервиса
extend-exclude = ["research"]
